# SPDX-License-Identifier: Apache-2.0
#
# origin-web bindings — thin wasm-bindgen layer over origin-crypto-sdk.
# Layer 2 of the origin-web architecture (see ../DESIGN.md §2.2).
#
# Depends on the SDK via git (what CI uses). The [patch] at the bottom
# redirects to the local sibling checkout for fast dev iteration; delete
# or comment it in CI where only the git source exists.

[package]
name = "origin-web"
version = "0.1.0"
edition = "2021"
authors = ["Origin Contributors"]
description = "Client-side WebAssembly bindings for the Origin cryptographic suite"
license = "Apache-2.0"
repository = "https://github.com/KidIkaros/origin-web"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The real crypto. Git source + wasm feature (browser entropy via Web Crypto).
origin-crypto-sdk = { git = "https://github.com/KidIkaros/OriginSDK", features = ["wasm"] }

# WASM <-> JS glue.
wasm-bindgen = "0.2"
js-sys = "0.3"

# Standalone primitives used directly in the teaser.
blake3 = "1.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Console error logging for the browser.
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"      # optimize for size — this ships to the browser
lto = true
codegen-units = 1

# --- LOCAL DEV OVERRIDE ---
# Point the git dependency at the sibling checkout so edits to the SDK are
# picked up without pushing. Comment out for CI / clean builds.
[patch."https://github.com/KidIkaros/OriginSDK"]
origin-crypto-sdk = { path = "../../origin-crypto-sdk" }
