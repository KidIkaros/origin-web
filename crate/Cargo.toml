# SPDX-License-Identifier: Apache-2.0
#
# origin-web bindings — thin wasm-bindgen layer over origin-crypto-sdk.
# Layer 2 of the origin-web architecture (see ../DESIGN.md §2.2).
#
# Depends on the SDK from crates.io (published, so CI needs no private-repo
# access). For local SDK iteration, uncomment the [patch] at the bottom to
# redirect to the sibling checkout.

# Standalone crate with its own workspace root.
[workspace]

[package]
name = "origin-web"
version = "0.1.0"
edition = "2021"
authors = ["Origin Contributors"]
description = "Client-side WebAssembly bindings for the Origin cryptographic suite"
license = "Apache-2.0"
repository = "https://github.com/KidIkaros/origin-web"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The real crypto. crates.io source + wasm feature (browser entropy via Web Crypto).
origin-crypto-sdk = { version = "0.7.1-rc.10", features = ["wasm"] }

# WASM <-> JS glue.
wasm-bindgen = "0.2"
js-sys = "0.3"

# All primitives come from origin-crypto-sdk (blake3 / Ed25519 re-exports,
# fill_random) — no standalone crypto deps.
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Console error logging for the browser.
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"      # optimize for size — this ships to the browser
lto = true
codegen-units = 1

# --- LOCAL DEV OVERRIDE (uncomment to iterate on the SDK without publishing) ---
[patch.crates-io]
origin-crypto-sdk = { path = "../../origin-crypto-sdk" }
